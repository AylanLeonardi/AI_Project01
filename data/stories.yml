version: "3.1"

stories:

- story: Compra de Jogo
  steps:
  - intent: saudacao
  - action: utter_saudacao
  - intent: comprar
  - checkpoint: fim_saudacao

- story: Alugar Jogo
  steps:
  - intent: alugar
  - checkpoint: fim_saudacao

- story: Especificando o jogo
- checkpoint: fim_saudacao
- action: dados_pedido_forms
  - active_loop: dados_pedido_forms
  - intent: descricao_jogo
  - action: utter_descricao_jogo
  - intent: enderecamento
  - action: utter_enderecamento
  - checkpoint: fim_dados_pedido

- story: Confirmação do Pedido
  steps:
  - checkpoint: fim_dados_pedido
  - intent: afirmacao
  - action: utter_finalizacao_pedido

- story: Pedido com erro
  steps:
  - checkpoint: fim_dados_pedido
  - intent: negacao
  - action: action_resetar_slots
  - checkpoint: fim_saudacao  
  
- story: Troca do Jogo
  steps:
  - intent: devolucao
  - action: utter_devolucao
  - intent: motivo
  - action: utter_motivo
  - intent: troca
  - action: utter_troca
  - intent: descricao_jogo
  - action: utter_descricao_jogo
  - intent: enderecamento
  - action: utter_enderecamento

- story: Reembolsamento do Jogo
  steps:
  - intent: devolucao
  - action: utter_devolucao
  - intent: motivo
  - action: utter_motivo
  - intent: reembolso
  - action: utter_reembolso
  - intent: enderecamento
  - action: utter_enderecamento

- story: Combrando o jogo
  steps:
    - intent: cobranca
    - action: utter_cobranca
    - intent: status
    - action: utter_status

